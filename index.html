<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="광운 도서관">
<meta name="theme-color" content="#8B1A2B">
<meta name="description" content="광운대학교 도서관 스터디룸 예약 시스템">
<title>광운대학교 도서관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Oswald:wght@500;600&display=swap" crossorigin rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#8B1A2B}
body{font-family:'Noto Sans KR',sans-serif;display:flex;justify-content:center;align-items:flex-start}
#app{width:100%;max-width:430px;height:100dvh;height:100vh;display:flex;flex-direction:column;background:#f5f5f5;position:relative;overflow:hidden}

/* STATUS */
.status-bar{background:#8B1A2B;color:white;padding-left:20px;padding-right:20px;padding-bottom:6px;padding-top:max(env(safe-area-inset-top),14px);display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:500;flex-shrink:0}
.status-right{display:flex;gap:6px;align-items:center}
.offline-banner{background:#e24b4a;color:white;text-align:center;font-size:11px;padding:6px;flex-shrink:0}

/* HEADER */
.header{background:#8B1A2B;padding:10px 16px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header-logo{display:flex;align-items:center;gap:10px}
.header-title .kr{font-size:16px;font-weight:700;color:white;letter-spacing:-0.5px}
.header-title .en{font-size:9px;font-weight:300;color:rgba(255,255,255,0.75);letter-spacing:1px}
.header-btn{background:none;border:none;color:white;cursor:pointer;padding:6px;border-radius:8px}
.header-btn i{font-size:20px}

/* NAV */
.bottom-nav{background:white;border-top:1px solid #e0e0e0;display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 10px;border:none;background:none;cursor:pointer;color:#999;position:relative}
.nav-item.active{color:#8B1A2B}
.nav-item i{font-size:22px;margin-bottom:3px}
.nav-item span{font-size:10px;font-weight:500}
.nav-badge{position:absolute;top:6px;right:calc(50% - 14px);background:#8B1A2B;color:white;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}

/* CONTENT */
.content{flex:1;overflow-y:auto;background:#f5f5f5;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{display:none}

/* HOME */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ddd;margin:12px}
.grid-item{background:white;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:110px;text-align:center;gap:8px}
.grid-item:active{background:#f0e8ea}
.grid-item .icon-wrap{width:52px;height:52px;position:relative}
.grid-item .icon-wrap svg{width:100%;height:100%}
.grid-label{font-size:13px;color:#333;font-weight:500;letter-spacing:-0.3px}
.home-copyright{text-align:center;padding:14px;font-size:10px;color:#aaa;letter-spacing:0.5px}

/* SECTION / CARD */
.section{padding:14px 14px 8px;font-size:12px;font-weight:700;color:#8B1A2B;letter-spacing:1px;text-transform:uppercase}
.card{background:white;border-radius:12px;margin:0 14px 12px;overflow:hidden;border:1px solid #ececec}
.card-body{padding:14px 16px}

/* ROOMS */
.room-card{background:white;border-radius:12px;margin:0 14px 10px;overflow:hidden;border:1px solid #ececec}
.room-card-header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#8B1A2B,#a52535)}
.room-card-header.r6{background:linear-gradient(135deg,#6B3A7D,#8B4F9E)}
.room-card-header.r8{background:linear-gradient(135deg,#2B5EA7,#3A7EC7)}
.room-card-header.r10{background:linear-gradient(135deg,#2A7A4A,#3A9A5F)}
.room-label{color:white;font-size:13px;font-weight:700}
.room-capacity{color:rgba(255,255,255,0.85);font-size:11px;margin-top:2px}
.room-slots{padding:10px 14px 12px;display:flex;flex-wrap:wrap;gap:6px}
.slot{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:500;border:1.5px solid;cursor:pointer;text-align:center;min-width:70px}
.slot.available{border-color:#8B1A2B;color:#8B1A2B;background:white}
.slot.available:active{background:#8B1A2B;color:white}
.slot.booked{border-color:#ddd;color:#bbb;background:#f9f9f9;cursor:not-allowed}
.slot.mine{border-color:#c4a35a;color:#8B6B00;background:#FFF8E7}
.slot.past{border-color:#eee;color:#ccc;background:#fafafa;cursor:not-allowed;text-decoration:line-through}
.date-chip.past{opacity:0.35;cursor:not-allowed;text-decoration:line-through}
.date-chip:disabled{cursor:not-allowed}
.slot-legend{display:flex;gap:10px;padding:0 14px 10px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#888}
.legend-dot{width:10px;height:10px;border-radius:3px;border:1.5px solid}
.legend-dot.a{border-color:#8B1A2B;background:white}
.legend-dot.b{border-color:#ddd;background:#f9f9f9}
.legend-dot.m{border-color:#c4a35a;background:#FFF8E7}

/* DATE */
.date-strip{display:flex;gap:6px;padding:10px 14px 6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.date-strip::-webkit-scrollbar{display:none}
.date-chip{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:1.5px solid #ddd;background:white;color:#555;font-weight:500;text-align:center}
.date-chip.active{background:#8B1A2B;border-color:#8B1A2B;color:white}

/* MODAL */
.modal-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:white;width:100%;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:92%;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:700;color:#222;margin-bottom:4px}
.modal-sub{font-size:12px;color:#888;margin-bottom:16px}

/* FORM */
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:600;color:#444;margin-bottom:6px;display:block}
.form-input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:16px;font-family:'Noto Sans KR',sans-serif;outline:none;color:#222;-webkit-appearance:none;background:white}
.form-input:focus{border-color:#8B1A2B}
.form-hint{font-size:11px;color:#888;margin-top:5px}

/* BUTTONS */
.btn-primary{width:100%;padding:14px;background:#8B1A2B;color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;margin-top:4px;-webkit-appearance:none}
.btn-primary:active{background:#6a1020}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-secondary{width:100%;padding:12px;background:white;color:#8B1A2B;border:1.5px solid #8B1A2B;border-radius:12px;font-size:14px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;margin-top:8px;-webkit-appearance:none}
.btn-sm{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;border:none}
.btn-sm.red{background:#8B1A2B;color:white}
.btn-sm.gold{background:#c4a35a;color:white}
.btn-sm.gray{background:#f0f0f0;color:#555;border:1px solid #ddd}
.btn-sm.blue{background:#1a5fa8;color:white}
.btn-sm.green{background:#2a7a4a;color:white}

/* BOOKINGS */
.booking-item{background:white;border-radius:12px;margin:0 14px 10px;overflow:hidden;border:1px solid #ececec}
.booking-top{padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #f5f5f5}
.booking-room{font-size:14px;font-weight:700;color:#222}
.booking-date{font-size:11px;color:#888;margin-top:2px}
.booking-badge{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700}
.booking-badge.upcoming{background:#EEF6FF;color:#1a5fa8}
.booking-badge.checked{background:#F0FFF4;color:#2a7a4a}
.booking-badge.done{background:#F5F5F5;color:#888}
.booking-badge.cancelled{background:#FFF5F5;color:#bbb}
.booking-info{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.booking-time{display:flex;align-items:center;gap:6px;font-size:13px;color:#444}
.booking-time i{font-size:15px;color:#8B1A2B}
.booking-actions{display:flex;gap:6px;flex-wrap:wrap}

/* MESSAGES */
.msg-item{background:white;margin:0 14px 8px;border-radius:12px;padding:13px 14px;border:1px solid #ececec;cursor:pointer}
.msg-item.unread{border-left:3px solid #8B1A2B}
.msg-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:5px}
.msg-title{font-size:13px;font-weight:600;color:#222;display:flex;align-items:center;gap:6px}
.msg-dot{width:7px;height:7px;background:#8B1A2B;border-radius:50%;flex-shrink:0;margin-top:3px}
.msg-time{font-size:10px;color:#aaa;white-space:nowrap;margin-left:8px}
.msg-body{font-size:12px;color:#666;line-height:1.5}

/* PROFILE */
.profile-card{background:white;border-radius:12px;margin:0 14px 12px;padding:16px;border:1px solid #ececec;display:flex;align-items:center;gap:14px}
.profile-avatar{width:56px;height:56px;background:#8B1A2B;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;font-weight:700;flex-shrink:0}
.profile-name{font-size:15px;font-weight:700;color:#222}
.profile-id{font-size:12px;color:#888;margin-top:3px;font-family:'Oswald',sans-serif;letter-spacing:1px}
.profile-dept{font-size:12px;color:#555;margin-top:2px}
.info-list{background:white;border-radius:12px;margin:0 14px 12px;border:1px solid #ececec;overflow:hidden}
.info-row{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid #f5f5f5;gap:12px}
.info-row:last-child{border-bottom:none}
.info-row i{font-size:18px;color:#8B1A2B;width:22px;flex-shrink:0}
.info-row-text{flex:1;font-size:13px;color:#222}
.info-row-value{font-size:13px;color:#888}

/* TOAST */
.toast{position:absolute;top:max(env(safe-area-inset-top),14px);left:14px;right:14px;background:#222;color:white;border-radius:12px;padding:12px 14px;z-index:200;display:flex;align-items:flex-start;gap:10px;font-size:12px;line-height:1.5;animation:toastIn 0.3s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.toast i{font-size:18px;color:#FFB84D;flex-shrink:0;margin-top:1px}
.toast-title{font-weight:700;margin-bottom:2px}
.toast-body{opacity:0.85}
.toast-close{margin-left:auto;background:none;border:none;color:white;cursor:pointer;font-size:20px;padding:0;opacity:0.7;flex-shrink:0;line-height:1}

/* CONFIRM BOX */
.confirm-box{background:#FFF8E7;border:1px solid #f0d89a;border-radius:10px;padding:12px 14px;margin:14px 0;font-size:12px;color:#7a5c00;line-height:1.6}

/* ID CARD */
.id-card{background:linear-gradient(135deg,#8B1A2B,#c0394f);border-radius:16px;margin:0 14px 12px;padding:18px;color:white;position:relative;overflow:hidden}
.id-card::after{content:'광운대학교';position:absolute;right:-20px;bottom:10px;font-size:48px;font-weight:700;opacity:0.06;white-space:nowrap;font-family:'Oswald',sans-serif}
.id-card-label{font-size:9px;opacity:0.7;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.id-card-value{font-size:14px;font-weight:600}
.id-card-num{font-size:22px;font-weight:700;letter-spacing:2px;font-family:'Oswald',sans-serif;margin-bottom:10px}
.id-card-barcode{height:36px;background:white;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;gap:1px;padding:4px 8px}
.bar{background:#222;border-radius:1px}

/* QR */
.qr-box{background:white;border-radius:12px;padding:20px;text-align:center;margin:14px 0}
.qr-code{display:inline-block;padding:12px;background:white;border:2px solid #eee;border-radius:8px}

/* INVITE */
.invite-code{background:#f9f9f9;border:1.5px dashed #c4a35a;border-radius:10px;padding:16px;text-align:center;margin:12px 0}
.invite-code .code{font-size:28px;font-weight:700;color:#8B1A2B;font-family:'Oswald',sans-serif;letter-spacing:4px}

/* STATS */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 14px 12px}
.stat-card{background:white;border-radius:12px;padding:14px;border:1px solid #ececec;text-align:center}
.stat-num{font-size:26px;font-weight:700;color:#8B1A2B;font-family:'Oswald',sans-serif}
.stat-label{font-size:11px;color:#888;margin-top:4px}
.chart-bar-wrap{margin:0 14px 12px;background:white;border-radius:12px;padding:14px;border:1px solid #ececec}
.chart-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chart-bar-label{font-size:11px;color:#555;width:60px;flex-shrink:0;text-align:right}
.chart-bar-track{flex:1;background:#f5f5f5;border-radius:4px;height:16px;overflow:hidden}
.chart-bar-fill{height:100%;background:#8B1A2B;border-radius:4px;transition:width 0.6s ease}
.chart-bar-val{font-size:11px;color:#888;width:24px;text-align:left}

/* ADMIN */
.admin-table{width:100%;border-collapse:collapse;font-size:12px}
.admin-table th{background:#f5f5f5;padding:8px 10px;text-align:left;color:#555;font-weight:600;border-bottom:1px solid #e0e0e0}
.admin-table td{padding:8px 10px;border-bottom:1px solid #f5f5f5;color:#333}
.admin-tab{padding:8px 14px;border:none;background:none;font-size:13px;color:#888;cursor:pointer;border-bottom:2px solid transparent;font-family:'Noto Sans KR',sans-serif;font-weight:500}
.admin-tab.active{color:#8B1A2B;border-bottom-color:#8B1A2B}

/* LOGIN */
.login-screen{background:#f0e8e9;min-height:100%;display:flex;flex-direction:column}
.login-header{background:#8B1A2B;padding-top:max(env(safe-area-inset-top),40px);padding-left:24px;padding-right:24px;padding-bottom:28px;text-align:center}
.login-header .title{color:white;font-size:18px;font-weight:700;margin-top:14px;letter-spacing:-0.5px}
.login-header .sub{color:rgba(255,255,255,0.7);font-size:11px;margin-top:4px;letter-spacing:1px}
.login-body{padding:24px 20px;flex:1}
.login-card{background:white;border-radius:16px;padding:22px;border:1px solid #e8d8da;box-shadow:0 4px 20px rgba(139,26,43,0.1)}
.login-card-title{font-size:16px;font-weight:700;color:#8B1A2B;text-align:center;margin-bottom:18px;font-family:'Oswald',sans-serif;letter-spacing:1px}
.login-footer{text-align:center;font-size:10px;color:#999;padding:14px;padding-bottom:max(env(safe-area-inset-bottom),14px);letter-spacing:0.5px}

/* STEP */
.step-badge{display:inline-flex;align-items:center;gap:6px;background:#FFF0F0;padding:5px 12px;border-radius:20px;font-size:11px;color:#8B1A2B;font-weight:600;margin-bottom:12px}
.generated-id{background:#f9f9f9;border:1.5px dashed #c4a35a;border-radius:10px;padding:16px;text-align:center;margin:12px 0}
.generated-id .id-label{font-size:11px;color:#888;margin-bottom:5px}
.generated-id .id-num{font-size:24px;font-weight:700;color:#8B1A2B;font-family:'Oswald',sans-serif;letter-spacing:2px}
.dept-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.dept-chip{padding:8px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:12px;color:#555;background:white;cursor:pointer;text-align:center}
.dept-chip.selected{border-color:#8B1A2B;color:#8B1A2B;background:#FFF0F2;font-weight:600}

/* TIME */
.time-selector{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.time-option{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid #e0e0e0;border-radius:10px;cursor:pointer;background:white}
.time-option.selected{border-color:#8B1A2B;background:#FFF0F2}
.time-option.disabled{opacity:0.4;cursor:not-allowed}
.time-option i{font-size:16px;color:#aaa}
.time-option.selected i{color:#8B1A2B}
.time-option-text{flex:1;font-size:13px;color:#333}
.time-option.selected .time-option-text{color:#8B1A2B;font-weight:600}
.time-radio{width:18px;height:18px;border-radius:50%;border:2px solid #ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.time-option.selected .time-radio{border-color:#8B1A2B}
.time-option.selected .time-radio::after{content:'';width:8px;height:8px;background:#8B1A2B;border-radius:50%;display:block}

/* NOTICE */
.notice-item{background:white;margin:0 14px 8px;border-radius:12px;padding:14px;border:1px solid #ececec}
.notice-title{font-size:13px;font-weight:600;color:#222;margin-bottom:4px}
.notice-date{font-size:11px;color:#aaa;margin-top:6px}

/* LOADING */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:#8B1A2B;gap:20px}
.loading-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:rgba(255,255,255,0.8);font-size:13px}

/* PUSH BANNER */
.push-banner{background:#1a5fa8;color:white;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:12px;flex-shrink:0}
.push-banner i{font-size:18px;flex-shrink:0}
.push-banner-btn{margin-left:auto;background:white;color:#1a5fa8;border:none;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
[data-fn],[data-overlay]{cursor:pointer;touch-action:manipulation}
.date-chip.past{opacity:0.35;cursor:not-allowed;text-decoration:line-through}
.slot.past{border-color:#e8e8e8;color:#ccc;background:#fafafa;cursor:not-allowed}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

<div id="app"><div class="loading-screen"><div class="loading-spinner"></div><div class="loading-text">광운대학교 도서관 로딩 중...</div></div></div>

══════════════════════════════════════════ */
function getDates(){
  // 2026년 6월 한 달 전체 (1일~30일)
  const d=[], days=['일','월','화','수','목','금','토'];
  const year=2026, month=6; // 6월
  const daysInMonth=30; // 6월은 30일
  const todayKey=getTodayKey();
  for(let day=1; day<=daysInMonth; day++){
    const nd=new Date(year, month-1, day);
    const key=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    d.push({
      key,
      label:key===todayKey?'오늘':days[nd.getDay()],
      date:day,
      isPast: key < todayKey  // 과거 날짜 여부
    });
  }
  return d;
}

// 오늘 날짜 키 (실제 현재 날짜, 단 6월 범위 밖이면 6월 1일로 클램프)
function getTodayKey(){
  const now=new Date();
  let y=now.getFullYear(), m=now.getMonth()+1, dd=now.getDate();
  // 데모: 실제 날짜 사용. 2026년 6월이 아니면 시뮬레이션을 위해 그대로 표시
  return `${y}-${String(m).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
}

// 현재 시각 (HH:MM 형식)
function getNowHM(){
  const now=new Date();
  return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}

// 날짜(YYYY-MM-DD) + 시각(HH:MM) → 타임스탬프(ms)
function toMs(dateKey, hm){
  const [y,mo,d]=dateKey.split('-').map(Number);
  const [h,mi]=hm.split(':').map(Number);
  return new Date(y, mo-1, d, h, mi, 0, 0).getTime();
}
// 입실 가능 여부: 시작 5분 전 ~ 10분 후
function canCheckInNow(booking){
  const startMs=toMs(booking.date, booking.slot);
  const now=Date.now();
  return now >= startMs-5*60*1000 && now <= startMs+10*60*1000;
}
// 입실 가능 시간 안내 문구
function checkInWindowText(booking){
  const startMs=toMs(booking.date, booking.slot);
  const now=Date.now();
  if(now < startMs-5*60*1000){
    const min=Math.ceil((startMs-5*60*1000-now)/60000);
    return `입실은 시작 5분 전부터 가능 (약 ${min}분 후)`;
  }
  if(now > startMs+10*60*1000) return '입실 가능 시간이 지났습니다';
  return '지금 입실 가능';
}

// 특정 날짜+시간 슬롯이 과거인지 판단
function isSlotPast(dateKey, slot){
  const todayKey=getTodayKey();
  if(dateKey < todayKey) return true;        // 지난 날짜
  if(dateKey > todayKey) return false;       // 미래 날짜
  // 같은 날: 시간 비교 (슬롯 시작시간이 현재시간보다 이전이면 과거)
  return slot <= getNowHM();
}

// 기본 선택 날짜: 오늘이 6월 범위면 오늘, 아니면 첫 예약가능일
function getDefaultDate(){
  const dates=getDates();
  const todayKey=getTodayKey();
  // 오늘이 목록에 있으면 오늘
  const todayInList=dates.find(d=>d.key===todayKey);
  if(todayInList) return todayKey;
  // 오늘이 6월 이전이면 6/1, 6월 이후면 마지막 날
  if(todayKey < dates[0].key) return dates[0].key;
  return dates[dates.length-1].key;
}

function slotKey(date,room,slot){return `${date}_${room}_${slot}`;}
function isBooked(date,room,slot){return !!state.bookedSlots[slotKey(date,room,slot)];}
function isMyBooking(date,room,slot){if(!state.user) return false; return state.bookedSlots[slotKey(date,room,slot)]===state.user.stuId;}
function hasBookingOnDate(date){if(!state.user) return false; return Object.keys(state.bookedSlots).some(k=>k.startsWith(date+'_')&&state.bookedSlots[k]===state.user.stuId);}
// 요구사항: 한 사람이 동시에 두 스터디룸을 점유할 수 없음
// 내가 만들었거나 참여중인 활성 예약(upcoming/checked)이 하나라도 있으면 true
function hasActiveBooking(){
  const myUid=state.fireUser?.uid;
  if(!myUid) return false;
  return state.bookings.some(b=>
    (b.uid===myUid || (Array.isArray(b.members)&&b.members.includes(myUid)))
    && (b.status==='upcoming'||b.status==='checked')
  );
}
function endTimeStr(s){return `${String(parseInt(s.split(':')[0])+1).padStart(2,'0')}:00`;}
function formatDate(d){const p=d.split('-'); return `${p[0]}년 ${parseInt(p[1])}월 ${parseInt(p[2])}일`;}
function relTime(d){const t=d instanceof Date?d:d.toDate?d.toDate():new Date(d); const diff=(Date.now()-t.getTime())/1000; if(diff<60) return '방금'; if(diff<3600) return `${Math.floor(diff/60)}분 전`; return `${Math.floor(diff/3600)}시간 전`;}
function genStuId(){return `${new Date().getFullYear()}${String(Math.floor(Math.random()*9000)+1000).padStart(4,'0')}`;}
function genInviteCode(){return Math.random().toString(36).substr(2,6).toUpperCase();}

function setupPWA(){
  // Blob URL 대신 data URI 방식 사용 (GitHub Pages 호환)
  try {
    const manifest={name:'광운대학교 도서관',short_name:'광운도서관',start_url:'./',display:'standalone',background_color:'#8B1A2B',theme_color:'#8B1A2B',orientation:'portrait'};
    const json=JSON.stringify(manifest);
    const dataURI='data:application/json;charset=utf-8,'+encodeURIComponent(json);
    const existing=document.querySelector('link[rel="manifest"]');
    if(!existing){
      const link=document.createElement('link');
      link.rel='manifest'; link.href=dataURI;
      document.head.appendChild(link);
    }
  } catch(e){ console.log('PWA manifest 설정 생략'); }
}

async function addMessage(title,body){
  if(!state.user) return;
  try{
    await db.collection('messages').add({
      uid: state.fireUser.uid,
      stuId: state.user.stuId,
      title, body,
      time: firebase.firestore.FieldValue.serverTimestamp(),
      read: false
    });
  }catch(e){ state.messages.unshift({id:Date.now(),title,body,time:new Date(),read:false}); state.unreadMsg=state.messages.filter(m=>!m.read).length; }
}

function addLocalMessage(title,body){
  state.messages.unshift({id:Date.now(),title,body,time:new Date(),read:false});
  state.unreadMsg=state.messages.filter(m=>!m.read).length;
}

function listenMessages(){
  if(!state.fireUser) return;
  if(state.unsubMessages) state.unsubMessages();
  state.unsubMessages=db.collection('messages')
    .where('uid','==',state.fireUser.uid)
    .limit(50)
    .onSnapshot(snap=>{
      // 클라이언트 정렬로 대체 (인덱스 불필요)
      state.messages=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{
        const ta=a.time?.toDate?a.time.toDate():new Date(a.time||0);
        const tb=b.time?.toDate?b.time.toDate():new Date(b.time||0);
        return tb-ta;
      });
      state.unreadMsg=state.messages.filter(m=>!m.read).length;
      render();
    },err=>console.log('msg err',err));
}

async function markRead(id){
  try{ await db.collection('messages').doc(id).update({read:true}); }
  catch(e){ const m=state.messages.find(x=>x.id===id); if(m)m.read=true; state.unreadMsg=state.messages.filter(m=>!m.read).length; render(); }
}

async function markAllRead(){
  const unread=state.messages.filter(m=>!m.read);
  const batch=db.batch();
  unread.forEach(m=>{if(typeof m.id==='string') batch.update(db.collection('messages').doc(m.id),{read:true});});
  try{ await batch.commit(); }catch(e){ state.messages.forEach(m=>m.read=true); state.unreadMsg=0; render(); }
}

/* ══════════════════════════════════════════
   FIRESTORE: BOOKINGS (REALTIME)
══════════════════════════════════════════ */
function listenBookings(){
  if(state.unsubBookings) state.unsubBookings();
  const today=getDates()[0].key;
  state.unsubBookings=db.collection('bookings')
    .where('date','>=',today)
    .onSnapshot(snap=>{
      const newSlots={};
      snap.docs.forEach(d=>{
        const b=d.data();
        // 활성 예약(upcoming, checked)만 슬롯을 점유. 취소/완료는 슬롯 해제
        if(b.status!=='upcoming' && b.status!=='checked') return;
        newSlots[slotKey(b.date,b.room,b.slot)]=b.stuId;
        if(b.duration===2){
          const si=SLOTS.indexOf(b.slot);
          if(si>=0&&si<SLOTS.length-1) newSlots[slotKey(b.date,b.room,SLOTS[si+1])]=b.stuId;
        }
      });
      state.bookedSlots=newSlots;
      if(state.user){
        const myUid=state.fireUser?.uid;
        state.bookings=snap.docs.filter(d=>{
          const b=d.data();
          // 내가 예약했거나(uid) 초대로 참여한(members 포함) 예약
          return b.uid===myUid || (Array.isArray(b.members)&&b.members.includes(myUid));
        }).map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.date>b.date?1:-1);
      }
      render();
    },err=>console.log('booking err',err));
}

async function listenAllBookings(){
  const snap=await db.collection('bookings').limit(100).get();
  return snap.docs.map(d=>({id:d.id,...d.data()}));
}

async function confirmWithdraw(){
  const pw=document.getElementById('withdrawPw')?.value;
  if(!pw){ showToast('입력 오류','비밀번호를 입력해주세요.','ti-alert-circle'); return; }
  const btn=document.getElementById('withdrawBtn');
  if(btn){ btn.disabled=true; btn.textContent='처리 중...'; }
  try{
    const user=auth.currentUser;
    const email=state.user.email;
    const uid=state.fireUser.uid;
    const stuId=state.user.stuId;
    // 1. 재인증 (보안 요구사항)
    const cred=firebase.auth.EmailAuthProvider.credential(email,pw);
    await user.reauthenticateWithCredential(cred);
    // 2. 내 예약들 취소 및 슬롯 잠금 해제
    const mySnap=await db.collection('bookings').where('uid','==',uid).get();
    const batch=db.batch();
    for(const docSnap of mySnap.docs){
      const b=docSnap.data();
      if(b.status==='upcoming'||b.status==='checked'){
        await db.collection('slotLocks').doc(`${b.date}_${b.room}_${b.slot}`).delete().catch(()=>{});
        if(b.duration===2&&b.slot2) await db.collection('slotLocks').doc(`${b.date}_${b.room}_${b.slot2}`).delete().catch(()=>{});
      }
      batch.delete(docSnap.ref);
    }
    // 3. 내 메시지 삭제
    const msgSnap=await db.collection('messages').where('uid','==',uid).get();
    msgSnap.docs.forEach(d=>batch.delete(d.ref));
    await batch.commit();
    // 4. 사용자 문서 삭제
    await db.collection('users').doc(uid).delete();
    // 5. 인증 계정 삭제
    await user.delete();
    // 6. 리스너 해제 및 상태 초기화
    if(state.unsubBookings){state.unsubBookings();state.unsubBookings=null;}
    if(state.unsubMessages){state.unsubMessages();state.unsubMessages=null;}
    state.modalOpen=false; state.bookings=[]; state.messages=[];
    state.bookedSlots={}; state.history=[]; state.unreadMsg=0;
    state.user=null; state.fireUser=null;
    showToast('탈퇴 완료','회원탈퇴가 완료되었습니다.','ti-check');
  }catch(e){
    let msg='탈퇴 처리 중 오류가 발생했습니다.';
    if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential') msg='비밀번호가 올바르지 않습니다.';
    showToast('탈퇴 실패',msg,'ti-alert-circle');
    if(btn){ btn.disabled=false; btn.textContent='탈퇴하기'; }
  }
}

async function book(date,room,slot,duration){
  if(!state.user||!state.fireUser) return false;
  // 요구사항 4: 과거 시간 예약 차단
  if(isSlotPast(date,slot)){showToast('예약 불가','이미 지난 시간은 예약할 수 없습니다.','ti-alert-circle');return false;}
  // 요구사항: 활성 예약이 이미 있으면 새 예약 불가 (동시 2개 스터디룸 점유 방지)
  if(hasActiveBooking()){showToast('예약 불가','이미 진행 중인 예약이 있습니다. 기존 예약을 취소 후 다시 예약해주세요.','ti-alert-circle');return false;}
  if(hasBookingOnDate(date)){showToast('예약 불가','동일 날짜에 이미 예약이 있습니다.','ti-alert-circle');return false;}
  if(isBooked(date,room,slot)){showToast('예약 불가','이미 예약된 시간입니다.','ti-alert-circle');return false;}
  if(duration===2){
    const si=SLOTS.indexOf(slot);
    if(si<0||si>=SLOTS.length-1){showToast('예약 불가','2시간 예약이 불가능한 시간입니다.','ti-alert-circle');return false;}
    // 두 번째 슬롯도 과거인지 확인
    if(isSlotPast(date,SLOTS[si+1])){showToast('예약 불가','이미 지난 시간은 예약할 수 없습니다.','ti-alert-circle');return false;}
    if(isBooked(date,room,SLOTS[si+1])){showToast('예약 불가','연속 시간대에 다른 예약이 있습니다.','ti-alert-circle');return false;}
  }
  const slot2=duration===2?SLOTS[SLOTS.indexOf(slot)+1]:null;
  const endTime=duration===2?endTimeStr(slot2):endTimeStr(slot);
  const roomName=ROOMS.find(r=>r.id===room)?.name;
  const slotDocId=`${date}_${room}_${slot}`;
  const startMs=toMs(date,slot);
  const endMs=toMs(date,endTime);
  const booking={uid:state.fireUser.uid,stuId:state.user.stuId,date,room,slot,slot2,duration,roomName,startTime:slot,endTime,startMs,endMs,status:'upcoming',notifiedEnter:false,notifiedExit:false,members:[state.fireUser.uid],memberStuIds:[state.user.stuId],createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  try{
    let bookingId;
    // 트랜잭션으로 중복 예약 방지
    await db.runTransaction(async(tx)=>{
      const slotRef=db.collection('slotLocks').doc(slotDocId);
      const slotSnap=await tx.get(slotRef);
      if(slotSnap.exists){ throw new Error('SLOT_TAKEN'); }
      if(duration===2){
        const slot2Id=`${date}_${room}_${slot2}`;
        const slot2Ref=db.collection('slotLocks').doc(slot2Id);
        const slot2Snap=await tx.get(slot2Ref);
        if(slot2Snap.exists){ throw new Error('SLOT_TAKEN'); }
        tx.set(slot2Ref,{stuId:state.user.stuId,date});
      }
      tx.set(slotRef,{stuId:state.user.stuId,date});
    });
    const ref=await db.collection('bookings').add(booking);
    bookingId=ref.id;
    await addMessage(`예약 완료 - ${roomName}`,`${date} ${slot} 예약이 완료되었습니다.`);

    // 알림과 자동취소는 전역 타이머(checkScheduledEvents)가 실제 시각에 맞춰 처리

    showToast('예약 완료',`${roomName} ${slot} 예약되었습니다.`,'ti-check');
    return true;
  }catch(e){
    if(e.message==='SLOT_TAKEN'){
      showToast('예약 불가','방금 다른 사용자가 예약했습니다.','ti-alert-circle');
    } else {
      showToast('예약 실패','예약 중 오류가 발생했습니다.','ti-alert-circle');
    }
    return false;
  }
}

// ── 실제 시각 기반 예약 이벤트 처리 (30초마다 실행) ──
async function checkScheduledEvents(){
  if(!state.fireUser) return;
  const now=Date.now();
  // 내 예약 중 활성 예약만 검사
  const myActive=state.bookings.filter(b=>
    (b.uid===state.fireUser.uid) && (b.status==='upcoming'||b.status==='checked') && b.startMs
  );
  for(const b of myActive){
    const startMs=b.startMs, endMs=b.endMs;
    try{
      // 1) 입실 안내: 시작 5분 전 도래 & 아직 알림 안 보냄
      if(b.status==='upcoming' && !b.notifiedEnter && now>=startMs-5*60*1000 && now<startMs+10*60*1000){
        await db.collection('bookings').doc(b.id).update({notifiedEnter:true});
        sendLocalNotification('⏰ 입실 안내',`${b.roomName} ${b.slot} 입실 바랍니다. (지금부터 입실 가능)`);
      }
      // 2) 미입실 자동취소: 시작 10분 후 경과 & 여전히 upcoming
      if(b.status==='upcoming' && now>startMs+10*60*1000){
        await db.collection('bookings').doc(b.id).update({status:'cancelled',autoCancelled:true});
        await db.collection('slotLocks').doc(`${b.date}_${b.room}_${b.slot}`).delete().catch(()=>{});
        if(b.duration===2&&b.slot2) await db.collection('slotLocks').doc(`${b.date}_${b.room}_${b.slot2}`).delete().catch(()=>{});
        await addMessage('예약 자동 취소',`${b.roomName} 입실 시간(10분) 초과로 예약이 자동 취소되었습니다.`);
        sendLocalNotification('예약 취소',`${b.roomName} 입실 시간 초과로 자동 취소되었습니다.`);
        continue;
      }
      // 3) 퇴실 5분 전 알림: 입실한 예약이 종료 5분 전 도래
      if(b.status==='checked' && !b.notifiedExit && now>=endMs-5*60*1000 && now<endMs){
        await db.collection('bookings').doc(b.id).update({notifiedExit:true});
        sendLocalNotification('⚠️ 퇴실 5분 전',`${b.roomName} 퇴실 5분 전입니다. 정리하고 나와 주세요.`);
      }
      // 4) 이용 완료: 입실한 예약이 종료 시각 경과
      if(b.status==='checked' && now>=endMs){
        await db.collection('bookings').doc(b.id).update({status:'done'});
        await db.collection('slotLocks').doc(`${b.date}_${b.room}_${b.slot}`).delete().catch(()=>{});
        if(b.duration===2&&b.slot2) await db.collection('slotLocks').doc(`${b.date}_${b.room}_${b.slot2}`).delete().catch(()=>{});
        await addMessage('이용 완료',`${b.roomName} 이용이 완료되었습니다. 이용해 주셔서 감사합니다.`);
      }
    }catch(e){console.error('스케줄 처리 오류',e);}
  }
}

async function cancelBooking(bookingId){
  try{
    const b=state.bookings.find(x=>x.id===bookingId);
    await db.collection('bookings').doc(bookingId).update({status:'cancelled'});
    // 슬롯 잠금 해제
    if(b){
      await db.collection('slotLocks').doc(`${b.date}_${b.room}_${b.slot}`).delete().catch(()=>{});
      if(b.duration===2){
        const si=SLOTS.indexOf(b.slot);
        if(si>=0&&si<SLOTS.length-1) await db.collection('slotLocks').doc(`${b.date}_${b.room}_${SLOTS[si+1]}`).delete().catch(()=>{});
      }
      await addMessage('예약 취소',`${b.roomName} ${b.date} ${b.slot} 예약이 취소되었습니다.`);
    }
    showToast('예약 취소됨','예약이 취소되었습니다.','ti-x');
  }catch(e){showToast('오류','취소 중 오류가 발생했습니다.','ti-alert-circle');}
}

// 참여자가 예약에서 나가기 (members에서 제거)
async function leaveBooking(bookingId){
  const myUid=state.fireUser?.uid;
  try{
    await db.collection('bookings').doc(bookingId).update({
      members:firebase.firestore.FieldValue.arrayRemove(myUid),
      memberStuIds:firebase.firestore.FieldValue.arrayRemove(state.user.stuId)
    });
    await addMessage('예약 나가기','참여한 스터디룸 예약에서 나갔습니다.');
    showToast('나가기 완료','예약에서 나갔습니다.','ti-check');
  }catch(e){showToast('오류','처리 중 오류가 발생했습니다.','ti-alert-circle');}
}

async function checkIn(bookingId){
  try{
    const doc=await db.collection('bookings').doc(bookingId).get();
    if(!doc.exists){ showToast('입실 불가','예약 정보를 찾을 수 없습니다.','ti-alert-circle'); return; }
    const data=doc.data();
    if(data.status==='cancelled'){ showToast('입실 불가','입실 시간이 초과되어 예약이 취소되었습니다.','ti-alert-circle'); return; }
    if(data.status==='done'){ showToast('입실 불가','이미 이용이 완료된 예약입니다.','ti-alert-circle'); return; }
    if(data.status==='checked'){ showToast('이미 입실','이미 입실 처리된 예약입니다.','ti-info-circle'); return; }
    // 요구사항: 입실 가능 시간 = 시작 5분 전 ~ 10분 후
    if(!canCheckInNow(data)){
      const startMs=toMs(data.date,data.slot), now=Date.now();
      if(now < startMs-5*60*1000) showToast('입실 불가','아직 입실 시간이 아닙니다. (시작 5분 전부터 가능)','ti-clock');
      else showToast('입실 불가','입실 가능 시간(시작 10분 후)이 지났습니다.','ti-clock');
      return;
    }
    await db.collection('bookings').doc(bookingId).update({status:'checked',checkInTime:firebase.firestore.FieldValue.serverTimestamp()});
    showToast('입실 완료','스터디룸 입실이 확인되었습니다.','ti-check');
    if(data) await addMessage('입실 완료',`${data.roomName} 입실이 확인되었습니다.`);
  }catch(e){showToast('오류','입실 처리 중 오류가 발생했습니다.','ti-alert-circle');}
}

            <rect x="26" y="136" width="18" height="18" fill="#222" rx="1"/>

            ${generateQRPattern(qrData)}
          </svg>
        </div>

      </div>

      </button>
      <button class="btn-secondary" data-fn="closeModal">닫기</button>
    </div>
  </div>`;
}

function generateQRPattern(data){
  let svg=''; const seed=data.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      if((r<4&&c<4)||(r<4&&c>4)||(r>4&&c<4)) continue;
      const x=70+(c*5), y=70+(r*5);
      const dark=((seed*(r+1)*(c+1))%7)>3;
      if(dark) svg+=`<rect x="${x}" y="${y}" width="4" height="4" fill="#222"/>`;
    }
  }
  return svg;
}

async function generateInvite(bookingId){
  const code=genInviteCode();
  try{
    await db.collection('invites').doc(code).set({bookingId,createdBy:state.user.stuId,uid:state.fireUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp(),used:false});
    state.inviteCode=code;
    state.modalType='invite';
    state.modalOpen=true;
    render();
  }catch(e){showToast('오류','초대 코드 생성 실패','ti-alert-circle');}
}

function copyInviteCode(){
  const code=state.inviteCode;
  if(!code) return;
  // 모바일 호환 복사: clipboard API 우선, 실패 시 폴백
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>{
      showToast('복사됨','코드가 클립보드에 복사되었습니다.','ti-copy');
    }).catch(()=>{ fallbackCopy(code); });
  } else {
    fallbackCopy(code);
  }
}
function fallbackCopy(text){
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('복사됨','코드가 복사되었습니다.','ti-copy');
  }catch(e){ showToast('복사 실패','코드를 길게 눌러 복사해주세요.','ti-info-circle'); }
}

async function acceptInvite(){
  const code=document.getElementById('inviteInput')?.value.trim().toUpperCase();
  if(!code){showToast('입력 오류','초대 코드를 입력해주세요.','ti-alert-circle');return;}
  const myUid=state.fireUser?.uid;
  // 요구사항: 이미 활성 예약(만들었거나 참여중)이 있으면 참여 불가
  if(hasActiveBooking()){
    showToast('참여 불가','이미 진행 중인 예약이 있어 다른 예약에 참여할 수 없습니다.','ti-alert-circle');
    return;
  }
  try{
    const doc=await db.collection('invites').doc(code).get();
    if(!doc.exists){showToast('오류','유효하지 않은 초대 코드입니다.','ti-alert-circle');return;}
    const invite=doc.data();
    const bookingRef=db.collection('bookings').doc(invite.bookingId);
    const bookingDoc=await bookingRef.get();
    if(!bookingDoc.exists){showToast('오류','예약을 찾을 수 없습니다.','ti-alert-circle');return;}
    const booking=bookingDoc.data();
    // 취소/완료된 예약엔 참여 불가
    if(booking.status!=='upcoming'&&booking.status!=='checked'){
      showToast('참여 불가','이미 종료되었거나 취소된 예약입니다.','ti-alert-circle');return;
    }
    // 본인이 만든 예약이면 참여 불필요
    if(booking.uid===myUid){showToast('안내','본인이 예약한 스터디룸입니다.','ti-info-circle');state.modalOpen=false;render();return;}
    // 이미 참여한 경우
    if(Array.isArray(booking.members)&&booking.members.includes(myUid)){
      showToast('안내','이미 참여한 예약입니다.','ti-info-circle');state.modalOpen=false;render();return;
    }
    // 정원 체크 (스터디룸 수용 인원)
    const roomInfo=ROOMS.find(r=>r.id===booking.room);
    const curMembers=Array.isArray(booking.members)?booking.members.length:1;
    if(roomInfo && curMembers>=roomInfo.capacity){
      showToast('참여 불가',`정원(${roomInfo.capacity}명)이 가득 찼습니다.`,'ti-alert-circle');return;
    }
    // members 배열에 나를 추가
    await bookingRef.update({
      members:firebase.firestore.FieldValue.arrayUnion(myUid),
      memberStuIds:firebase.firestore.FieldValue.arrayUnion(state.user.stuId)
    });
    await addMessage('초대 수락',`${booking.roomName} ${booking.date} ${booking.startTime} 예약에 참여했습니다.`);
    showToast('참여 완료',`${booking.roomName} 예약에 참여했습니다.`,'ti-check');
    state.modalOpen=false;
    state.screen='booking';
    render();
  }catch(e){console.error('초대 오류',e);showToast('오류','초대 코드 처리 중 오류가 발생했습니다.','ti-alert-circle');}
}

  if(screen==='notice') state.notices=undefined; // 공지 진입 시 새로고침
  if(screen==='stats') state.statsBookings=undefined; // 통계 진입 시 새로고침
  if(state.screen!==screen) state.history.push(state.screen);
  state.screen=screen; state.modalOpen=false; render();
}

  state.screen=state.history.length>0?state.history.pop():'home';

}

function renderReserve(){
  const dates=getDates();
  const todayHasBooking=hasBookingOnDate(state.selectedDate);
  const selPast = state.selectedDate < getTodayKey();
  return `<div class="content" style="padding-top:10px">
    <div class="section">그룹 스터디룸 예약 (2026년 6월)</div>
    <div class="date-strip">${dates.map(d=>{
      const past=d.isPast;
      const cls=`date-chip${state.selectedDate===d.key?' active':''}${past?' past':''}`;
      const dataAttr=past?'':`data-fn="setDate" data-a1="${d.key}"`;
      return `<div class="${cls}" ${dataAttr}><span style="display:block;font-size:9px;opacity:0.7;margin-bottom:1px">${d.label}</span><span>${d.date}</span></div>`;
    }).join('')}</div>
    <div style="padding:4px 14px 8px;font-size:12px;color:#888">${formatDate(state.selectedDate)}${state.selectedDate===getTodayKey()?' (오늘)':''}</div>
    ${selPast?`<div style="margin:0 14px 10px;padding:10px 14px;background:#FFF5F5;border:1px solid #f0c0c0;border-radius:10px;font-size:12px;color:#a33"><i class="ti ti-calendar-x" style="margin-right:4px"></i>지난 날짜는 예약할 수 없습니다.</div>`:''}
    ${todayHasBooking?`<div style="margin:0 14px 10px;padding:10px 14px;background:#FFF8E7;border:1px solid #f0d89a;border-radius:10px;font-size:12px;color:#7a5c00"><i class="ti ti-alert-triangle" style="margin-right:4px"></i>이 날짜에 이미 예약이 있습니다.</div>`:''}
    <div class="slot-legend"><div class="legend-item"><div class="legend-dot a"></div>예약 가능</div><div class="legend-item"><div class="legend-dot b"></div>예약 완료</div><div class="legend-item"><div class="legend-dot m"></div>내 예약</div></div>
    ${ROOMS.map(room=>`<div class="room-card">
      <div class="room-card-header ${room.colorClass}">
        <div><div class="room-label">${room.name}</div><div class="room-capacity"><i class="ti ti-users" style="font-size:11px;margin-right:3px"></i>${room.capacity}인 | ${room.desc}</div></div>

      <div class="room-slots">${SLOTS.map(slot=>{
        const past=isSlotPast(state.selectedDate,slot);
        const mine=isMyBooking(state.selectedDate,room.id,slot);
        const booked=isBooked(state.selectedDate,room.id,slot)&&!mine;
        let cls,label;
        if(past){ cls='past'; label='마감'; }
        else if(mine){ cls='mine'; label='내 예약'; }
        else if(booked){ cls='booked'; label='예약됨'; }

        const clickable=(cls==='available'&&!todayHasBooking);
        const dataAttr=clickable?`data-fn="openBookModal" data-a1="${room.id}" data-a2="${slot}"`:'';
        return `<div class="slot ${cls}" ${dataAttr}>${slot}<br><span style="font-size:9px;opacity:0.7">${label}</span></div>`;
      }).join('')}</div>
    </div>`).join('')}
    <div style="height:16px"></div>
  </div>`;
}

/* ══════════════════════════════════════════
   RENDER: BOOK MODAL
══════════════════════════════════════════ */
function renderBookModal(){
  const room=ROOMS.find(r=>r.id===state.selectedRoom);
  const slot=state.selectedSlot;
  const si=SLOTS.indexOf(slot);
  // 2시간 예약 가능 조건: 다음 슬롯이 존재 + 예약 안됨 + 과거 아님
  const nextSlot = (si>=0 && si<SLOTS.length-1) ? SLOTS[si+1] : null;
  const canDo2 = nextSlot!==null
    && !isBooked(state.selectedDate,state.selectedRoom,nextSlot)
    && !isSlotPast(state.selectedDate,nextSlot);
  const end1=endTimeStr(slot);
  const end2=canDo2?endTimeStr(nextSlot):'불가';
  // 2시간 불가 사유
  let reason2='';
  if(nextSlot===null) reason2=' (마지막 시간대)';
  else if(isBooked(state.selectedDate,state.selectedRoom,nextSlot)) reason2=' (다음 시간 예약됨)';
  else if(isSlotPast(state.selectedDate,nextSlot)) reason2=' (시간 지남)';
  return `<div class="modal-overlay" data-overlay="1">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">${room.name} 예약</div>
      <div class="modal-sub">${formatDate(state.selectedDate)}</div>
      <div class="form-group"><label class="form-label">이용 시간 선택</label>
        <div class="time-selector">
          <div class="time-option${state.selectedDuration===1?' selected':''}" data-fn="selectDuration" data-a1="1"><div class="time-radio"></div><i class="ti ti-clock"></i><div class="time-option-text">1시간 &nbsp;${slot} ~ ${end1}</div></div>
          <div class="time-option${state.selectedDuration===2?' selected':''}${!canDo2?' disabled':''}" ${canDo2?'data-fn="selectDuration" data-a1="2"':''}><div class="time-radio"></div><i class="ti ti-clock-2"></i><div class="time-option-text">2시간 &nbsp;${canDo2?slot+' ~ '+end2:reason2}</div></div>
        </div>
      </div>
      <div class="confirm-box"><i class="ti ti-info-circle" style="color:#c4a35a;margin-right:4px"></i>예약 직후 입실 안내 알림이 발송됩니다.<br>입실하지 않으면 1분 후 자동 취소됩니다.<br>입실 후 1분이 지나면 이용 완료 처리됩니다.</div>
      <div style="font-size:12px;color:#888;margin-bottom:8px">학번: <b style="color:#222">${state.user.stuId}</b></div>
      <button class="btn-primary" id="bookBtn" data-fn="confirmBook">예약하기</button>
      <button class="btn-secondary" data-fn="closeModal">취소</button>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════
   RENDER: BOOKINGS
══════════════════════════════════════════ */
function renderBookings(){
  const myUid=state.fireUser?.uid;
  const myBookings=state.bookings.filter(b=>
    b.uid===myUid || (Array.isArray(b.members)&&b.members.includes(myUid))
  ).sort((a,b)=>{
    const order={upcoming:0,checked:1,done:2,cancelled:3};
    const oa=order[a.status]??9, ob=order[b.status]??9;
    if(oa!==ob) return oa-ob;
    return (a.date||'')<(b.date||'')?-1:1;
  });
  return `<div class="content" style="padding-top:12px">
    <div class="section">내 예약 현황</div>
    ${myBookings.length===0?`<div style="text-align:center;padding:40px 20px;color:#bbb"><i class="ti ti-calendar-off" style="font-size:40px;display:block;margin-bottom:10px"></i>예약 내역이 없습니다</div>`:''}
    ${myBookings.map(b=>{
      const isOwner=b.uid===myUid;
      const memberCount=Array.isArray(b.members)?b.members.length:1;
      const roleBadge=isOwner
        ? `<span style="font-size:10px;color:#8B1A2B;background:#FFF0F2;padding:2px 8px;border-radius:10px;font-weight:600">예약자</span>`
        : `<span style="font-size:10px;color:#1a5fa8;background:#EEF6FF;padding:2px 8px;border-radius:10px;font-weight:600">참여자</span>`;
      return `<div class="booking-item">
      <div class="booking-top">
        <div><div class="booking-room">${b.roomName}</div><div class="booking-date">${formatDate(b.date)}</div></div>
        <div class="booking-badge ${b.status}">${b.status==='upcoming'?'예약중':b.status==='checked'?'입실완료':b.status==='done'?'이용완료':'취소됨'}</div>
      </div>
      <div style="padding:0 14px 8px;display:flex;align-items:center;gap:8px">
        ${roleBadge}
        <span style="font-size:11px;color:#888"><i class="ti ti-users" style="font-size:12px;margin-right:2px"></i>참여 ${memberCount}명</span>
      </div>
      <div class="booking-info">
        <div class="booking-time"><i class="ti ti-clock"></i>${b.startTime} ~ ${b.endTime} (${b.duration}시간)</div>
        <div class="booking-actions">
          ${(b.status==='upcoming'||b.status==='checked')&&isOwner?`<button class="btn-sm red" data-fn="cancelBooking" data-a1="${b.id}">취소</button><button class="btn-sm gold" data-fn="openQR" data-a1="${b.id}">QR입실</button><button class="btn-sm blue" data-fn="generateInvite" data-a1="${b.id}">초대</button>`:''}
          ${(b.status==='upcoming'||b.status==='checked')&&!isOwner?`<button class="btn-sm gold" data-fn="openQR" data-a1="${b.id}">QR입실</button><button class="btn-sm gray" data-fn="leaveBooking" data-a1="${b.id}">나가기</button>`:''}
        </div>
      </div>
    </div>`;
    }).join('')}
    <div style="height:16px"></div>
  </div>`;
}

/* ══════════════════════════════════════════
   RENDER: STATS
══════════════════════════════════════════ */
function renderStats(){
  // 전체 사용자 통계 - allStatsBookings 로드 (최초 1회)
  if(state.statsBookings===undefined){
    state.statsBookings=null;
    db.collection('bookings').get().then(snap=>{
      state.statsBookings=snap.docs.map(d=>d.data());
      render();
    }).catch(()=>{ state.statsBookings=[]; render(); });
  }
  const all=state.statsBookings;
  if(all===null){
    return `<div class="content" style="padding-top:12px"><div class="section">전체 이용 통계</div><div style="text-align:center;padding:40px;color:#bbb"><div class="loading-spinner" style="margin:0 auto;border-color:#ddd;border-top-color:#8B1A2B"></div></div></div>`;
  }
  const total=all.length;
  const completed=all.filter(b=>b.status==='checked'||b.status==='done').length;
  const cancelled=all.filter(b=>b.status==='cancelled').length;
  const roomCounts={};
  ROOMS.forEach(r=>roomCounts[r.name]=0);
  all.forEach(b=>{ if(roomCounts[b.roomName]!==undefined) roomCounts[b.roomName]++; });
  const slotCounts={}; SLOTS.forEach(s=>slotCounts[s]=0);
  all.forEach(b=>{ if(slotCounts[b.slot]!==undefined) slotCounts[b.slot]++; });
  const maxRoom=Math.max(1,...Object.values(roomCounts));
  const maxSlot=Math.max(1,...Object.values(slotCounts));
  return `<div class="content" style="padding-top:12px">
    <div class="section">전체 이용 통계</div>
    <div style="padding:0 14px 8px;font-size:11px;color:#999"><i class="ti ti-users" style="margin-right:3px"></i>모든 사용자의 예약 기록 기반</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">총 예약</div></div>
      <div class="stat-card"><div class="stat-num">${completed}</div><div class="stat-label">이용 완료</div></div>
      <div class="stat-card"><div class="stat-num">${cancelled}</div><div class="stat-label">취소</div></div>
      <div class="stat-card"><div class="stat-num">${total>0?Math.round(completed/total*100):0}%</div><div class="stat-label">이용률</div></div>
    </div>
    <div class="section">스터디룸별 이용</div>
    <div class="chart-bar-wrap">
      ${ROOMS.map(r=>`<div class="chart-bar-row">
        <div class="chart-bar-label">${r.capacity}인실</div>
        <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${Math.round(roomCounts[r.name]/maxRoom*100)}%"></div></div>
        <div class="chart-bar-val">${roomCounts[r.name]}</div>
      </div>`).join('')}
    </div>
    <div class="section">시간대별 이용</div>
    <div class="chart-bar-wrap">
      ${SLOTS.map(s=>`<div class="chart-bar-row">
        <div class="chart-bar-label">${s}</div>
        <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${Math.round(slotCounts[s]/maxSlot*100)}%"></div></div>
        <div class="chart-bar-val">${slotCounts[s]}</div>
      </div>`).join('')}
    </div>
    <div style="height:16px"></div>
  </div>`;
}

async function loadAdminData(){
  state.adminBookings=await listenAllBookings();
  const uSnap=await db.collection('users').get();
  state.adminUsers=uSnap.docs.map(d=>d.data());
  // 공지 목록 로드
  try{
    const nSnap=await db.collection('notices').get();
    state.adminNotices=nSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'')<(a.date||'')?-1:1);
  }catch(e){ state.adminNotices=[]; }
  render();
}

// 관리자: 예약 강제 취소
async function adminForceCancel(bookingId){
  try{
    const ref=db.collection('bookings').doc(bookingId);
    const doc=await ref.get();
    if(!doc.exists){ showToast('오류','예약을 찾을 수 없습니다.','ti-alert-circle'); return; }
    const b=doc.data();
    await ref.update({status:'cancelled',autoCancelled:false,adminCancelled:true});
    // 슬롯 잠금 해제
    await db.collection('slotLocks').doc(`${b.date}_${b.room}_${b.slot}`).delete().catch(()=>{});
    if(b.duration===2&&b.slot2) await db.collection('slotLocks').doc(`${b.date}_${b.room}_${b.slot2}`).delete().catch(()=>{});
    // 예약자에게 알림 메시지
    await db.collection('messages').add({uid:b.uid,stuId:b.stuId,title:'예약 취소 안내',body:`관리자에 의해 ${b.roomName} ${b.date} ${b.startTime} 예약이 취소되었습니다.`,time:firebase.firestore.FieldValue.serverTimestamp(),read:false});
    showToast('취소 완료','예약이 강제 취소되었습니다.','ti-check');
    state.adminBookings=null; // 새로고침
    loadAdminData();
  }catch(e){console.error(e);showToast('오류','취소 처리 중 오류가 발생했습니다.','ti-alert-circle');}
}

// 관리자: 시간 무관 강제 입실 처리
async function adminForceCheckIn(bookingId){
  try{
    const ref=db.collection('bookings').doc(bookingId);
    const doc=await ref.get();
    if(!doc.exists){ showToast('오류','예약을 찾을 수 없습니다.','ti-alert-circle'); return; }
    const b=doc.data();
    if(b.status!=='upcoming'){ showToast('처리 불가','입실 가능한 상태가 아닙니다.','ti-alert-circle'); return; }
    // 시간 제한 없이 강제 입실
    await ref.update({status:'checked',checkInTime:firebase.firestore.FieldValue.serverTimestamp(),adminCheckIn:true});
    await db.collection('messages').add({uid:b.uid,stuId:b.stuId,title:'입실 처리 안내',body:`관리자에 의해 ${b.roomName} ${b.date} ${b.startTime} 예약이 입실 처리되었습니다.`,time:firebase.firestore.FieldValue.serverTimestamp(),read:false});
    showToast('입실 처리','강제 입실 처리되었습니다.','ti-check');
    state.adminBookings=null;
    loadAdminData();
  }catch(e){console.error(e);showToast('오류','입실 처리 중 오류가 발생했습니다.','ti-alert-circle');}
}

// 관리자: 공지 등록

        <thead><tr><th>이름</th><th>학번</th><th>학과</th><th>예약수</th></tr></thead>
        <tbody>${users.filter(u=>!u.isAdmin).map(u=>`<tr>
          <td>${u.name}</td><td style="font-family:monospace">${u.stuId}</td><td>${u.dept}</td>
          <td>${bookings.filter(b=>b.stuId===u.stuId&&b.status!=='cancelled').length}회</td>
        </tr>`).join('')}</tbody>
      </table>
    </div></div>`:`
    <div class="card" style="margin:0 14px 12px"><div class="card-body">
      <div style="font-size:13px;font-weight:700;color:#222;margin-bottom:10px">새 공지 작성</div>
      <div class="form-group"><label class="form-label">제목</label><input class="form-input" id="noticeTitle" type="text" placeholder="공지 제목"></div>
      <div class="form-group"><label class="form-label">내용</label><textarea class="form-input" id="noticeBody" rows="3" placeholder="공지 내용" style="resize:none;font-family:'Noto Sans KR',sans-serif"></textarea></div>
      <button class="btn-primary" data-fn="adminAddNotice">공지 등록</button>
    </div></div>
    <div class="section">등록된 공지</div>
    ${(state.adminNotices||[]).length===0?`<div style="text-align:center;padding:20px;color:#bbb;font-size:13px">등록된 공지가 없습니다</div>`:''}
    ${(state.adminNotices||[]).map(n=>`<div class="notice-item">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="notice-title">${n.title}</div>
        <button class="btn-sm red" style="padding:3px 8px;font-size:10px;flex-shrink:0" data-fn="adminDeleteNotice" data-a1="${n.id}">삭제</button>
      </div>
      <div style="font-size:12px;color:#555;margin:6px 0;line-height:1.5">${n.body}</div>
      <div class="notice-date">${n.date||''}</div>
    </div>`).join('')}`}
    <div style="height:16px"></div>
  </div>`;
}

/* ══════════════════════════════════════════
   RENDER: NOTICE
══════════════════════════════════════════ */
function renderNotice(){
  // Firestore 공지 로드 (최초 1회)
  if(state.notices===undefined){
    state.notices=null; // 로딩 중 표시
    db.collection('notices').get().then(snap=>{
      state.notices=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'')<(a.date||'')?-1:1);
      render();
    }).catch(()=>{ state.notices=[]; render(); });
  }
  const notices=state.notices;
  return `<div class="content" style="padding-top:12px">
    <div class="section">공지사항</div>
    ${notices===null?`<div style="text-align:center;padding:30px;color:#bbb"><div class="loading-spinner" style="margin:0 auto;border-color:#ddd;border-top-color:#8B1A2B"></div></div>`:''}
    ${notices&&notices.length===0?`<div style="text-align:center;padding:40px 20px;color:#bbb"><i class="ti ti-speakerphone" style="font-size:40px;display:block;margin-bottom:10px"></i>등록된 공지가 없습니다</div>`:''}
    ${(notices||[]).map(n=>`<div class="notice-item"><div class="notice-title">${n.title}</div><div style="font-size:12px;color:#555;margin:6px 0;line-height:1.5">${n.body}</div><div class="notice-date">${n.date||''}${n.author?' · '+n.author:''}</div></div>`).join('')}
    <div style="height:16px"></div>
  </div>`;
}

/* ══════════════════════════════════════════
   MAIN RENDER
══════════════════════════════════════════ */
function render(){
  const app=document.getElementById('app');
  if(!app) return;
  if(state.screen==='loading'){app.innerHTML=`<div class="loading-screen"><div class="loading-spinner"></div><div class="loading-text">광운대학교 도서관 로딩 중...</div></div>`;return;}
  if(state.screen==='login'){app.innerHTML=`<div style="flex:1;overflow-y:auto">${renderLogin()}</div>`;return;}
  if(state.screen==='register'){app.innerHTML=`<div style="flex:1;overflow-y:auto">${renderRegister()}</div>`;return;}

  const navScreens=['home','reserve','booking','messages','profile'];
  const navLabels={home:'홈',reserve:'예약',booking:'내 예약',messages:'메시지',profile:'프로필'};
  const navIcons={home:'ti-home',reserve:'ti-door-enter',booking:'ti-calendar-check',messages:'ti-mail',profile:'ti-user'};
  const unread=state.messages.filter(m=>!m.read).length;
  const showBack=state.screen!=='home';

  let contentHtml='';
  if(state.screen==='home') contentHtml=renderHome();
  else if(state.screen==='reserve') contentHtml=renderReserve();
  else if(state.screen==='booking') contentHtml=renderBookings();
  else if(state.screen==='messages') contentHtml=renderMessages();
  else if(state.screen==='profile') contentHtml=renderProfile();
  else if(state.screen==='idcard') contentHtml=renderIDCard();
  else if(state.screen==='notice') contentHtml=renderNotice();
  else if(state.screen==='stats') contentHtml=renderStats();
  else if(state.screen==='admin') contentHtml=renderAdmin();

  let modal='';
  if(state.modalOpen&&state.modalType==='book') modal=renderBookModal();
  else if(state.modalOpen&&state.modalType==='qr') modal=renderQRModal();
  else if(state.modalOpen&&state.modalType==='invite') modal=renderInviteModal();
  else if(state.modalOpen&&state.modalType==='withdraw') modal=renderWithdrawModal();
  else if(state.modalOpen&&state.modalType==='reset') modal=renderResetModal();

  app.innerHTML=`
    ${!state.isOnline?`<div class="offline-banner"><i class="ti ti-wifi-off" style="margin-right:4px"></i>오프라인 상태입니다</div>`:''}
    <div class="status-bar">
      <span id="clock">${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</span>
      <div class="status-right"><div style="width:7px;height:7px;border-radius:50%;background:${state.isOnline?'#4caf50':'#e24b4a'}"></div><span style="font-size:11px;opacity:0.8">${state.isOnline?'온라인':'오프라인'}</span></div>
    </div>
    <div class="header">
      ${showBack?`<button class="header-btn" data-fn="goBack"><i class="ti ti-arrow-left"></i></button>`:`<div style="width:32px"></div>`}
      <div class="header-logo"><div style="width:34px;height:34px">${KW_LOGO}</div><div class="header-title"><div class="kr">광운대학교</div><div class="en">KwangWoon University</div></div></div>
      ${showBack?`<button class="header-btn" data-fn="goHome"><i class="ti ti-home" style="font-size:20px"></i></button>`:`<button class="header-btn" data-fn="logout"><i class="ti ti-power" style="font-size:20px"></i></button>`}
    </div>
    ${contentHtml}
    ${navScreens.includes(state.screen)?`<div class="bottom-nav">${['home','reserve','booking','messages','profile'].map(s=>`
      <button class="nav-item${state.screen===s?' active':''}" data-fn="navigate" data-a1="${s}">
        ${s==='messages'&&unread>0?`<div style="position:relative;display:inline-block"><i class="ti ${navIcons[s]}"></i><div class="nav-badge">${unread}</div></div>`:`<i class="ti ${navIcons[s]}"></i>`}
        <span>${navLabels[s]}</span>
      </button>`).join('')}</div>`:''}
    ${state.toast?`<div class="toast"><i class="ti ${state.toast.icon}"></i><div><div class="toast-title">${state.toast.title}</div><div class="toast-body">${state.toast.body}</div></div><button class="toast-close" data-fn="closeToast">×</button></div>`:''}
    ${modal}
  `;
}

/* ══════════════════════════════════════════
   GLOBAL EXPORTS & INIT
══════════════════════════════════════════ */
// ── 헬퍼: 안전한 상태 조작 함수들 ──
function closeModal(){ state.modalOpen=false; state.inviteCode=null; render(); }
function setAdminTab(tab){ state.adminTab=tab; render(); }
function closeToast(){ state.toast=null; render(); }
function setDate(d){ state.selectedDate=d; render(); }
function goHome(){ navigate('home'); }
async function checkInAndClose(id){ await checkIn(id); closeModal(); }

// ── 이벤트 위임: 모든 클릭을 안전하게 처리 ──
document.addEventListener('click', function(e) {
  // 모달 오버레이 클릭 시 닫기 (오버레이 자체를 직접 클릭한 경우만)
  if(e.target.hasAttribute && e.target.hasAttribute('data-overlay')){
    if(typeof closeModal==='function') closeModal();
    return;
  }
  // 클릭된 요소 또는 부모 중 data-fn 속성이 있는 요소 찾기
  let el = e.target;
  let btn = null;
  for(let i=0; i<5; i++){
    if(!el || el===document.body || !el.hasAttribute) break;
    if(el.hasAttribute('data-fn')){ btn=el; break; }
    el = el.parentElement;
  }
  // data-fn 버튼이 아니면 아무것도 안 함 (input, onclick 등은 정상 동작)
  if(!btn) return;
  const fn = btn.getAttribute('data-fn');
  const a1 = btn.getAttribute('data-a1');
  const a2 = btn.getAttribute('data-a2');
  const a3 = btn.getAttribute('data-a3');
  const args = [a1,a2,a3].filter(x=>x!==null&&x!==undefined);
  try {
    const func = window[fn];
    if(typeof func === 'function'){
      func(...args);
    } else {
      console.warn('함수를 찾을 수 없음:', fn);
    }
  } catch(err) { console.error('클릭 오류:', fn, err); }
});  // 버블링 단계(기본) - 캡처/stopPropagation 제거로 input·onclick 충돌 해결 // 캡처 단계에서 처리 (버블링 전)

window.closeModal=closeModal; window.closeToast=closeToast;
window.setDate=setDate; window.setAdminTab=setAdminTab;
window.adminForceCancel=adminForceCancel; window.adminForceCheckIn=adminForceCheckIn; window.adminAddNotice=adminAddNotice; window.adminDeleteNotice=adminDeleteNotice; window.goHome=goHome; window.checkInAndClose=checkInAndClose;
window.doLogin=doLogin; window.goToRegister=goToRegister; window.regBack=regBack; window.regNext1=regNext1; window.regNext2=regNext2;
window.completeReg=completeReg; window.navigate=navigate; window.logout=logout;
window.goBack=goBack; window.openBookModal=openBookModal; window.confirmBook=confirmBook;
window.cancelBooking=cancelBooking; window.leaveBooking=leaveBooking; window.checkIn=checkIn; window.openQR=openQR;
window.generateInvite=generateInvite; window.acceptInvite=acceptInvite;
window.openInviteModal=openInviteModal; window.openResetModal=openResetModal; window.sendResetEmail=sendResetEmail; window.resendVerification=resendVerification; window.copyInviteCode=copyInviteCode;
window.markAllRead=markAllRead; window.markRead=markRead;
window.selectDuration=selectDuration; window.selectDept=selectDept;
window.requestPushPermission=requestPushPermission;
window.openWithdrawModal=openWithdrawModal; window.confirmWithdraw=confirmWithdraw;

setupPWA();
if(typeof Notification!=='undefined' && Notification.permission==='granted') state.pushGranted=true;

// ── 초기 화면 즉시 렌더 (Firebase 응답을 기다리지 않음) ──
// auth.onAuthStateChanged가 곧 호출되지만, 만약 지연/실패해도
// 사용자가 로그인 화면을 볼 수 있도록 보장
setTimeout(()=>{
  if(state.screen==='loading'){
    state.screen='login';
    render();
  }
}, 1500);

// 페이지 로드 직후 일단 한 번 렌더
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', ()=>{ if(state.screen==='loading'){render();} });
} else {
  render();
}

setInterval(()=>{const el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});},10000);

// 실제 시각 기반 예약 이벤트 체크 (30초마다)
setInterval(()=>{ checkScheduledEvents(); }, 30000);
// 앱 시작 직후에도 한 번 실행
setTimeout(()=>{ checkScheduledEvents(); }, 5000);
</script>
